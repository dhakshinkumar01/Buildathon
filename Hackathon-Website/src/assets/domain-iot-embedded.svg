<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 666 422" width="666" height="422">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Yellow Glow -->
    <radialGradient id="yellowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd000" stop-opacity="0"/>
    </radialGradient>

    <!-- Circuit Trace Pattern -->
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="2 2"/>
      <circle cx="0" cy="0" r="1.5" fill="#3f3f46"/>
    </pattern>

    <!-- Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- Base Card Background -->
  <rect width="666" height="422" fill="url(#bgGrad)" />
  <rect width="666" height="422" fill="url(#circuitGrid)" opacity="0.6"/>

  <!-- Ambient Glow behind MCU -->
  <circle cx="333" cy="211" r="180" fill="url(#yellowGlow)" />

  <!-- PCB Circuit Traces -->
  <g stroke="#ffd000" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Left Trace -->
    <path d="M 120 80 L 210 80 L 250 120 L 250 160" />
    <circle cx="120" cy="80" r="4" fill="#ffd000"/>

    <!-- Bottom Left Trace -->
    <path d="M 100 320 L 180 320 L 230 270 L 250 270" />
    <circle cx="100" cy="320" r="4" fill="#ffd000"/>

    <!-- Top Right Trace (Wi-Fi Signal Branch) -->
    <path d="M 540 90 L 450 90 L 410 130 L 410 160" />
    <circle cx="540" cy="90" r="4" fill="#ffd000"/>

    <!-- Bottom Right Trace (Sensor Branch) -->
    <path d="M 560 330 L 480 330 L 430 280 L 410 280" />
    <circle cx="560" cy="330" r="4" fill="#ffd000"/>

    <!-- Bus lines -->
    <path d="M 160 140 L 210 140 L 230 160" stroke="#a1a1aa" stroke-dasharray="4 4"/>
    <path d="M 500 280 L 450 280 L 430 260" stroke="#a1a1aa" stroke-dasharray="4 4"/>
  </g>

  <!-- Node Icons / Visual Elements -->
  
  <!-- Wi-Fi Node (Top Right) -->
  <g transform="translate(520, 65)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#18181b" stroke="#ffd000" stroke-width="2"/>
    <path d="M 15 32 A 16 16 0 0 1 35 32 M 19 36 A 10 10 0 0 1 31 36 M 25 40 A 1 1 0 0 1 25 40.5" fill="none" stroke="#ffd000" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Sensor Node (Bottom Right) -->
  <g transform="translate(540, 305)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#18181b" stroke="#ffd000" stroke-width="2"/>
    <circle cx="25" cy="25" r="10" stroke="#ffd000" stroke-width="2" fill="none"/>
    <path d="M 25 10 L 25 15 M 25 35 L 25 40 M 10 25 L 15 25 M 35 25 L 40 25" stroke="#ffd000" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Hardware Actuator / Chip Node (Top Left) -->
  <g transform="translate(95, 55)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#18181b" stroke="#ffd000" stroke-width="2"/>
    <path d="M 18 18 H 32 V 32 H 18 Z" fill="#ffd000"/>
    <path d="M 14 25 H 18 M 32 25 H 36 M 25 14 V 18 M 25 32 V 36" stroke="#ffd000" stroke-width="2"/>
  </g>

  <!-- Cloud / Edge Node (Bottom Left) -->
  <g transform="translate(75, 295)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#18181b" stroke="#ffd000" stroke-width="2"/>
    <path d="M 16 32 C 14 32 12 30 12 27 C 12 24.5 14 22.5 16.5 22.5 C 17.5 19.5 20.5 17.5 24 17.5 C 28 17.5 31 20 32 23 C 34 23 36 25 36 27.5 C 36 30 34 32 31.5 32 Z" fill="none" stroke="#ffd000" stroke-width="2"/>
  </g>

  <!-- Central Microcontroller IC Chip -->
  <g transform="translate(243, 131)">
    <!-- Outer Chip Shadow -->
    <rect x="4" y="4" width="170" height="150" rx="16" fill="#000000" opacity="0.6"/>

    <!-- Main Chip Body -->
    <rect x="0" y="0" width="170" height="150" rx="16" fill="url(#chipGrad)" stroke="#ffd000" stroke-width="3"/>

    <!-- IC Pins - Left Side -->
    <g fill="#ffd000">
      <rect x="-10" y="20" width="10" height="6" rx="2"/>
      <rect x="-10" y="40" width="10" height="6" rx="2"/>
      <rect x="-10" y="60" width="10" height="6" rx="2"/>
      <rect x="-10" y="80" width="10" height="6" rx="2"/>
      <rect x="-10" y="100" width="10" height="6" rx="2"/>
      <rect x="-10" y="120" width="10" height="6" rx="2"/>
    </g>

    <!-- IC Pins - Right Side -->
    <g fill="#ffd000">
      <rect x="170" y="20" width="10" height="6" rx="2"/>
      <rect x="170" y="40" width="10" height="6" rx="2"/>
      <rect x="170" y="60" width="10" height="6" rx="2"/>
      <rect x="170" y="80" width="10" height="6" rx="2"/>
      <rect x="170" y="100" width="10" height="6" rx="2"/>
      <rect x="170" y="120" width="10" height="6" rx="2"/>
    </g>

    <!-- IC Pins - Top Side -->
    <g fill="#ffd000">
      <rect x="30" y="-10" width="6" height="10" rx="2"/>
      <rect x="55" y="-10" width="6" height="10" rx="2"/>
      <rect x="80" y="-10" width="6" height="10" rx="2"/>
      <rect x="105" y="-10" width="6" height="10" rx="2"/>
      <rect x="130" y="-10" width="6" height="10" rx="2"/>
    </g>

    <!-- IC Pins - Bottom Side -->
    <g fill="#ffd000">
      <rect x="30" y="150" width="6" height="10" rx="2"/>
      <rect x="55" y="150" width="6" height="10" rx="2"/>
      <rect x="80" y="150" width="6" height="10" rx="2"/>
      <rect x="105" y="150" width="6" height="10" rx="2"/>
      <rect x="130" y="150" width="6" height="10" rx="2"/>
    </g>

    <!-- Chip Corner Pin 1 Marker -->
    <circle cx="20" cy="20" r="4" fill="#ffd000"/>

    <!-- Inner Metallic Core -->
    <rect x="25" y="30" width="120" height="90" rx="8" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>

    <!-- Chip Engraving Text -->
    <text x="85" y="58" fill="#ffd000" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1.5">MCU / SOC-32</text>
    <text x="85" y="76" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">IOT &amp; EMBEDDED</text>
    <text x="85" y="94" fill="#a1a1aa" font-family="monospace" font-size="9" text-anchor="middle">2 TRACKS • DUAL CORE</text>
    
    <!-- Status LEDs -->
    <circle cx="40" cy="104" r="3" fill="#22c55e"/>
    <circle cx="52" cy="104" r="3" fill="#ffd000"/>
  </g>

  <!-- Banner overlay at bottom of SVG graphic -->
  <g transform="translate(183, 345)">
    <rect x="0" y="0" width="300" height="42" rx="21" fill="#ffd000" stroke="#09090b" stroke-width="2"/>
    <text x="150" y="26" fill="#09090b" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">IOT &amp; EMBEDDED SYSTEMS</text>
  </g>
</svg>
